# democratic-csi — ZFS zvols on scarif via targetcli iSCSI
csiDriver:
  name: "org.democratic-csi.iscsi"

storageClasses:
  - name: scarif-iscsi
    defaultClass: false
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: ext4
    mountOptions: []

volumeSnapshotClasses: []

controller:
  externalSnapshotter:
    enabled: false
  # Allow on yavin until more workers exist
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  nodeSelector: {}

node:
  hostPID: true
  driver:
    # Talos iscsi-tools v0.2.0 — hostPath under node.driver (chart layout)
    iscsiDirHostPath: /var/iscsi
    iscsiDirHostPathType: DirectoryOrCreate
    extraEnv:
      - name: PATH
        value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - name: ISCSIADM_HOST_STRATEGY
        value: nsenter
      - name: ISCSIADM_HOST_PATH
        value: /usr/local/sbin/iscsiadm

driver:
  config:
    driver: zfs-generic-iscsi
    sshConnection:
      host: 192.168.5.10
      port: 22
      username: root
      # privateKey injected by install.sh from secrets/scarif-csi
      privateKey: ""
    zfs:
      datasetParentName: scarif-ssd/k8s/vols
      detachedSnapshotsDatasetParentName: scarif-ssd/k8s/snaps
      zvolEnableReservation: false
      # inherit pool compression
      zvolCompression: ""
      zvolDedup: ""
      zvolBlocksize: ""
    iscsi:
      shareStrategy: targetCli
      shareStrategyTargetCli:
        basename: iqn.2026-09.com.jacobdrury.scarif
        tpg:
          attributes:
            authentication: 0
            generate_node_acls: 1
            cache_dynamic_acls: 1
            demo_mode_write_protect: 0
          auth: {}
        block:
          attributes:
            emulate_tpu: 0
      targetPortal: "192.168.5.10:3260"
      interface: ""
      namePrefix: "csi-"
      nameSuffix: "-prd"
