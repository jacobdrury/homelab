# Argo CD — lean single-cluster bootstrap (Envoy HTTPRoute later → argocd.lab)
global:
  domain: argocd.lab.jacobdrury.com

configs:
  params:
    # TLS terminates at Envoy later; port-forward / HTTP for now
    server.insecure: true
  cm:
    url: https://argocd.lab.jacobdrury.com
    # Public repo — no credentials needed
    timeout.reconciliation: 120s

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  ingress:
    enabled: false

controller:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

# Keep HA / extras off on small cluster
dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
