# RWX media / shared files on scarif UD NFS export.
# Apps must run as uid 99 / gid 100 (Unraid NFS squash → nobody:users).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: scarif-nfs
  labels:
    homelab.jacobdrury.com/backend: scarif-nfs
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.168.5.10
  share: /mnt/disks/ZXA0VZBA
  # PVC name under the export root (e.g. pvc-…/)
  subDir: "${pvc.metadata.namespace}/${pvc.metadata.name}"
  mountPermissions: "0775"
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.2
  - hard
  - noatime
