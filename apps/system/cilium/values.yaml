# Talos-specific Cilium values (kube-proxy replacement via KubePrism).
# Chart version pinned in install.sh / future Argo Application.

ipam:
  mode: kubernetes

kubeProxyReplacement: true

k8sServiceHost: localhost
k8sServicePort: 7445

# Talos already mounts cgroup v2; Cilium must reuse it.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Required on Talos: no SYS_MODULE; drop from default agent caps.
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Talos hostDNS forwarding needs legacy routing (Cilium Talos docs).
bpf:
  hostLegacyRouting: true

operator:
  replicas: 1

# L2 announcements for LoadBalancer Services (Envoy VIP on Homelab VLAN).
# Rate limits sized for lease churn on a small cluster — see Cilium L2 docs.
l2announcements:
  enabled: true

k8sClientRateLimit:
  qps: 50
  burst: 100

# Keep lean until Hubble is wanted in Phase 5.
hubble:
  enabled: false
  relay:
    enabled: false
  ui:
    enabled: false
