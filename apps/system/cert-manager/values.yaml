# cert-manager — Let's Encrypt DNS-01 via Cloudflare
crds:
  enabled: true

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# Gateway API cert shim not required — we issue Certificate CRs for the Envoy Secret.
