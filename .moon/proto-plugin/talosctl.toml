name = "talosctl"
type = "cli"

[platform.linux]
download-file = "talosctl-linux-{arch}"

[platform.macos]
download-file = "talosctl-darwin-{arch}"

[platform.windows]
download-file = "talosctl-windows-{arch}.exe"

[install]
download-url = "https://github.com/siderolabs/talos/releases/download/v{version}/{download_file}"
unpack = false

[install.arch]
aarch64 = "arm64"
x86_64 = "amd64"

[install.exes.talosctl]
primary = true

[resolve]
git-url = "https://github.com/siderolabs/talos"
