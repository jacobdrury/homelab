# =============================================================================
# Shared lab constants — single source of truth for OpenTofu under infrastructure/.
# Each project reads this via lab_locals.tf (created on moon run <project>:init).
# =============================================================================

# Public DNS zone for apps and infra (*.lab.jacobdrury.com).
# Authoritative records + R2: infrastructure/cloudflare/ (+ external-dns in Phase 2+).
dns:
  zone: lab.jacobdrury.com
  # Resolvers for *.lab — Pi-hole forwards here on LAN; Tailscale split DNS away.
  cloudflare_resolvers:
    - 1.1.1.1
    - 1.0.0.1
  # Legacy guest IPs retired when VMs stop (arr media stack → k8s).
  transitional_hosts: {}
  # App / transitional UI frontends → Envoy ingress VIP (.21 on yavin; hostNetwork).
  # Storage DNS (scarif-direct → Unraid IP) is derived in dns/lab_locals.tf from hosts.scarif.
  app_hosts:
    argocd: 192.168.5.21
    auth: 192.168.5.21 # Authentik IdP
    uptime: 192.168.5.21 # Uptime Kuma (via Authentik proxy)
    jellyfin: 192.168.5.21
    qbittorrent: 192.168.5.21
    sonarr: 192.168.5.21 # anime (primary)
    sonarr-tv: 192.168.5.21
    prowlarr: 192.168.5.21
    homeassistant: 192.168.5.21
    pihole: 192.168.5.21
    it-tools: 192.168.5.21 # sharevb IT-Tools
    scarif: 192.168.5.21 # HTTPS UI via Envoy; NFS/iSCSI use scarif-direct.lab
    proxmox: 192.168.5.21 # homelab02 Proxmox UI


networks:
  # Primary trusted LAN (UniFi native / VLAN 1). Proxmox, clients; DNS → Homelab Pi-hole VIP.
  drury:
    unifi_name: Drury
    # Native LAN — no vlan_id in UniFi resource (provider shows 0).
    gateway_cidr: 192.168.1.1/24
    route_cidr: 192.168.1.0/24 # Tailscale interim — drop when pc (black) leaves lab
    dhcp:
      start: 192.168.1.6
      stop: 192.168.1.254
    unifi_id: 62e83ed5dfd87906d68f64e3 # import into infrastructure/unifi

  iot:
    unifi_name: Drury - IoT
    vlan_id: 2
    gateway_cidr: 192.168.2.1/24
    route_cidr: 192.168.2.0/24
    dhcp:
      start: 192.168.2.6
      stop: 192.168.2.254
    unifi_id: 62f46882a72f49373da0410f

  guest:
    unifi_name: Drury - Guest
    vlan_id: 3
    gateway_cidr: 192.168.3.1/24
    route_cidr: 192.168.3.0/24
    dhcp:
      start: 192.168.3.6
      stop: 192.168.3.254
    unifi_id: 62f46a0ca72f49373da04170

  camera:
    unifi_name: Drury - Camera
    vlan_id: 4
    gateway_cidr: 192.168.4.1/24
    route_cidr: 192.168.4.0/24
    dhcp:
      start: 192.168.4.6
      stop: 192.168.4.254
    unifi_id: 63ed4c46f2c44b350d4ff31b

  # Isolated homelab VLAN (UniFi VLAN 5). Talos CPs, Unraid, cluster workloads.
  homelab:
    unifi_name: Homelab
    vlan_id: 5
    gateway_cidr: 192.168.5.1/24 # UniFi network subnet (gateway at .1)
    route_cidr: 192.168.5.0/24   # Tailscale subnet router (steady: k8s operator)
    dhcp:
      # Leave .10–.22 for static infra (scarif, Talos, Envoy .21, Pi-hole DNS .22).
      start: 192.168.5.50
      stop: 192.168.5.254
    unifi_id: 6a9391bffbf2c016aea02b37
    # Infra A records on this VLAN — Cloudflare grey-cloud in infrastructure/cloudflare/.
    hosts:
      scarif:
        ip: 192.168.5.10
        role: unraid # NAS · NFS/iSCSI
        dns: false # A record is app_hosts scarif → Envoy; storage is scarif-direct.lab

      yavin:
        ip: 192.168.5.11
        role: talos_cp # Mac Mini · bootstrap CP #1
      k8s:
        ip: 192.168.5.11
        role: kubernetes_api # same node until VIP .20
      hoth:
        ip: 192.168.5.12
        role: talos_cp # Phase 4
      endor:
        ip: 192.168.5.13
        role: talos_cp # Phase 4
      naboo:
        ip: 192.168.5.14
        role: talos_worker # Unraid VM on scarif · interim until Phase 4
      envoy:
        ip: 192.168.5.21
        # Real secondary IP on yavin (Envoy hostNetwork). Not Cilium L2.
        # Phase 4: HA via kube-vip/VRRP — keep this address in app_hosts.
        role: envoy_vip
      pihole_dns:
        ip: 192.168.5.22
        # Cilium L2 LoadBalancer for UDP/TCP 53 only. UI stays app_hosts → Envoy .21.
        # Not Tailscale-facing (split DNS → Cloudflare). See docs/architecture/pihole.md.
        role: pihole_dns_vip
        dns: false # no Cloudflare A — LAN DHCP only

services:
  pihole:
    # LAN DNS — Cilium L2 LoadBalancer VIP on Homelab (DHCP + UniFi ZBF).
    host: 192.168.5.22
  homeassistant:
    host: 192.168.2.8 # legacy HA OS VM (IoT); live HA is k8s → Envoy .21 — stop when soak done
  proxmox:
    host: 192.168.1.12 # homelab02 · Proxmox UI :8006 · hosts arr / legacy HA VM (Pi-hole LXC 106 retiring)
  # Uptime Kuma Socket.IO API for OpenTofu (not Authentik / uptime.lab).
  # Tailscale L7 Ingress uses Serve; L3 Service expose DNAT timed out from CI.
  uptime_kuma:
    tailscale_hostname: uptime-kuma
    port: 443
    api_endpoint: https://uptime-kuma.ibex-ladon.ts.net
  # gateway: 192.168.1.1  # UDM Pro — add when needed for IaC

tailscale:
  magic_dns_suffix: ibex-ladon.ts.net # Rename tailnet in admin console — not settable via OpenTofu
  interim_subnet_router: homelab02 # advertises Drury (+ Homelab until k8s cutover)
  k8s_subnet_router: prd-homelab-router # Connector hostname on prd
