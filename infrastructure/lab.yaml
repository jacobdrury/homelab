# =============================================================================
# Shared lab constants — single source of truth for OpenTofu under infrastructure/.
# Each project reads this via lab_locals.tf (created on moon run <project>:init).
# =============================================================================

# Public DNS zone for apps and infra (*.lab.jacobdrury.com).
# Authoritative records: infrastructure/dns/ (+ external-dns in Phase 2+).
dns:
  zone: lab.jacobdrury.com
  # Resolvers for *.lab — Pi-hole forwards here on LAN; Tailscale split DNS away.
  cloudflare_resolvers:
    - 1.1.1.1
    - 1.0.0.1
  # Legacy guest IPs (firewall / inventory). DNS for UIs is app_hosts → Envoy.
  transitional_hosts:
    arr: 192.168.1.9 # VM 101 · jellyfin/*arr via Envoy
  # App / transitional UI frontends → Envoy VIP (Cilium L2 LB).
  # Storage DNS (scarif-direct → Unraid IP) is derived in dns/lab_locals.tf from hosts.scarif.
  app_hosts:
    argocd: 192.168.5.21
    auth: 192.168.5.21 # Authentik IdP
    jellyfin: 192.168.5.21
    qbittorrent: 192.168.5.21
    sonarr: 192.168.5.21 # anime (primary)
    sonarr-tv: 192.168.5.21
    prowlarr: 192.168.5.21
    homeassistant: 192.168.5.21
    pihole: 192.168.5.21
    scarif: 192.168.5.21 # HTTPS UI via Envoy; NFS/iSCSI use scarif-direct.lab
    proxmox: 192.168.5.21 # homelab02 Proxmox UI


networks:
  # Primary trusted LAN (UniFi VLAN 1). Pi-hole, Proxmox, arr VM, IoT gateway path.
  drury:
    unifi_name: Drury
    route_cidr: 192.168.1.0/24 # Tailscale interim — drop when pc (black) leaves lab

  # Isolated homelab VLAN (UniFi VLAN 5). Talos CPs, Unraid, cluster workloads.
  homelab:
    unifi_name: Homelab
    vlan_id: 5
    gateway_cidr: 192.168.5.1/24 # UniFi network subnet (gateway at .1)
    route_cidr: 192.168.5.0/24   # Tailscale subnet router (steady: k8s operator)
    dhcp:
      start: 192.168.5.6
      stop: 192.168.5.254
    # Infra A records on this VLAN — Cloudflare grey-cloud in infrastructure/dns/.
    hosts:
      scarif:
        ip: 192.168.5.10
        role: unraid # NAS · NFS/iSCSI
        dns: false # A record is app_hosts scarif → Envoy; storage is scarif-direct.lab

      yavin:
        ip: 192.168.5.11
        role: talos_cp # Mac Mini · bootstrap CP #1
      k8s:
        ip: 192.168.5.11
        role: kubernetes_api # same node until VIP .20
      hoth:
        ip: 192.168.5.12
        role: talos_cp # Phase 4
      endor:
        ip: 192.168.5.13
        role: talos_cp # Phase 4
      naboo:
        ip: 192.168.5.14
        role: talos_worker # Unraid VM on scarif · interim until Phase 4
      envoy:
        ip: 192.168.5.21
        role: envoy_vip # Cilium L2 LoadBalancer for Gateway/lab

services:
  pihole:
    host: 192.168.1.11 # LXC on homelab02 · network: drury · migrates to k8s last
  homeassistant:
    host: 192.168.2.8 # VM 105 · IoT VLAN · migrates to k8s later
  proxmox:
    host: 192.168.1.12 # homelab02 · Proxmox UI :8006 · hosts arr / Pi-hole / HA
  # gateway: 192.168.1.1  # UDM Pro — add when needed for IaC

tailscale:
  magic_dns_suffix: ibex-ladon.ts.net # Rename tailnet in admin console — not settable via OpenTofu
  interim_subnet_router: homelab02 # advertises routes on host; TF enables in admin
