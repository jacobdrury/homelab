# App-of-apps root — self-managed: first source syncs this file so Git owns root.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Own this Application (clusters/prd/root.yaml). Bootstrap still applies once;
    # after that, merge to main updates root without kubectl.
    - repoURL: https://github.com/jacobdrury/homelab.git
      targetRevision: main
      path: clusters/prd
      directory:
        include: root.yaml
    - repoURL: https://github.com/jacobdrury/homelab.git
      targetRevision: main
      path: clusters/prd/platform
      directory:
        recurse: true
        include: '*/application.yaml'
    - repoURL: https://github.com/jacobdrury/homelab.git
      targetRevision: main
      path: clusters/prd/apps
      directory:
        recurse: true
        include: '*/application.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Avoid client-side apply resourceVersion=0 failures when updating child Applications.
      - ServerSideApply=true
