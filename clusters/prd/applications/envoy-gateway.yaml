# Envoy Gateway Helm stays on install.sh (Argo OCI→Docker Hub 401 for this chart).
# Argo owns Gateway / Certificate / HTTPRoute manifests only.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jacobdrury/homelab.git
    targetRevision: main
    path: apps/system/envoy-gateway
    directory:
      include: '{gateway.yaml,httproute-argocd.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
