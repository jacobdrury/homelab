# Authentik blueprint — Grafana OIDC.
# Client secret: Homelab 1Password "prd Grafana OIDC" (password) → ExternalSecret
# grafana-oidc → worker env GRAFANA_OIDC_CLIENT_SECRET.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-grafana
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  grafana.yaml: |
    version: 1
    metadata:
      name: grafana-sso
    entries:
      - model: authentik_core.group
        id: group-grafana-admins
        state: present
        identifiers:
          name: Grafana Admins
        attrs:
          name: Grafana Admins

      - model: authentik_providers_oauth2.scopemapping
        id: scope-grafana-groups
        state: present
        identifiers:
          name: Grafana groups
        attrs:
          name: Grafana groups
          scope_name: groups
          expression: |
            return {"groups": [group.name for group in request.user.groups.all()]}

      - model: authentik_providers_oauth2.oauth2provider
        id: provider-grafana
        state: present
        identifiers:
          name: Grafana
        attrs:
          name: Grafana
          client_type: confidential
          client_id: grafana
          client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.lab.jacobdrury.com/login/generic_oauth
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
            - !KeyOf scope-grafana-groups
          sub_mode: hashed_user_id
          issuer_mode: per_provider
          include_claims_in_id_token: true

      - model: authentik_core.application
        id: app-grafana
        state: present
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          slug: grafana
          provider: !KeyOf provider-grafana
          policy_engine_mode: any
          meta_launch_url: https://grafana.lab.jacobdrury.com
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: prd Grafana OIDC
        property: password
