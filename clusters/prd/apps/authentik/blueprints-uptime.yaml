# Authentik blueprint — Uptime Kuma Proxy Provider (official integration).
# Traffic: Envoy uptime.lab → authentik-server (embedded outpost) → Kuma Service.
# After deploy: create local admin once, then Settings → Security → Disable Auth.
# https://integrations.goauthentik.io/monitoring/uptime-kuma/
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-uptime
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  uptime.yaml: |
    version: 1
    metadata:
      name: uptime-kuma-proxy
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: provider-uptime
        state: present
        identifiers:
          name: Uptime Kuma
        attrs:
          name: Uptime Kuma
          mode: proxy
          external_host: https://uptime.lab.jacobdrury.com
          internal_host: http://uptime-kuma.uptime-kuma.svc.cluster.local:3001
          internal_host_ssl_validation: false
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          skip_path_regex: |
            ^/status(/.*)?$
            ^/status-page$
            ^/assets/.*
            ^/api/push/.*
            ^/api/badge/.*
            ^/api/status-page/.*
            ^/icon.svg$
            ^/upload/.*

      - model: authentik_core.application
        id: app-uptime
        state: present
        identifiers:
          slug: uptime-kuma
        attrs:
          name: Uptime Kuma
          slug: uptime-kuma
          provider: !KeyOf provider-uptime
          policy_engine_mode: any
          meta_launch_url: https://uptime.lab.jacobdrury.com

      - model: authentik_outposts.outpost
        id: outpost-embedded
        state: present
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          providers:
            - !KeyOf provider-uptime
