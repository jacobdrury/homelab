# Authentik cleanup — remove IT-Tools Proxy Provider (app is direct Envoy now).
# Safe to delete this ConfigMap after Authentik has applied state: absent once.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-it-tools
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  it-tools.yaml: |
    version: 1
    metadata:
      name: it-tools-proxy
    entries:
      - model: authentik_core.application
        id: app-it-tools
        state: absent
        identifiers:
          slug: it-tools

      - model: authentik_providers_proxy.proxyprovider
        id: provider-it-tools
        state: absent
        identifiers:
          name: IT-Tools
