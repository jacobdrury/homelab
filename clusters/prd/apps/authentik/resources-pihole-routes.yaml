# HTTPRoute: pihole.lab → Authentik Proxy → pihole.pihole.svc:80
# Blueprint: blueprints-pihole.yaml. LAN DNS still LXC until DHCP cutover.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - pihole.lab.jacobdrury.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: authentik-server
          port: 80
          weight: 1
