# HTTPRoute for pihole.lab → Authentik Proxy (cutover only).
# Until cutover: transitional/resources.yaml still points Envoy → LXC .11.
# Cutover steps: see docs/architecture/pihole.md
# 1. Confirm k8s DNS VIP .22 answers + OpenTofu applied to pod(s)
# 2. Include this file in authentik Application directory.include
# 3. Remove the pihole Backend + HTTPRoute from transitional/resources.yaml
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - pihole.lab.jacobdrury.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: authentik-server
          port: 80
          weight: 1
