# Authentik blueprint ConfigMap — mounted by the chart (blueprints.configMaps).
# Client secret comes from ExternalSecret argocd-oidc via worker env (!Env).
# Homelab 1Password item: "prd Argo CD OIDC" (password field).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-argocd
  namespace: authentik
  annotations:
    # Before Helm worker Deployment (default wave 0) so the mount exists.
    argocd.argoproj.io/sync-wave: "-1"
data:
  argocd.yaml: |
    version: 1
    metadata:
      name: argocd-sso
    entries:
      - model: authentik_core.group
        id: group-argocd-admins
        state: present
        identifiers:
          name: Argo CD Admins
        attrs:
          name: Argo CD Admins

      - model: authentik_providers_oauth2.oauth2provider
        id: provider-argocd
        state: present
        identifiers:
          name: Argo CD
        attrs:
          name: Argo CD
          client_type: confidential
          client_id: argocd
          client_secret: !Env ARGOCD_OIDC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.lab.jacobdrury.com/auth/callback
            - matching_mode: strict
              url: http://localhost:8085/auth/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
          sub_mode: hashed_user_id
          issuer_mode: per_provider
          include_claims_in_id_token: true

      - model: authentik_core.application
        id: app-argocd
        state: present
        identifiers:
          slug: argocd
        attrs:
          name: Argo CD
          slug: argocd
          provider: !KeyOf provider-argocd
          policy_engine_mode: any
          meta_launch_url: https://argocd.lab.jacobdrury.com
