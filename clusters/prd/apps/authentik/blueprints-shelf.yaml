# Authentik blueprint — Shelf Proxy Provider.
# Traffic: Envoy shelf.lab → authentik-server (embedded outpost) → shelf-web Service.
# /health skipped for Uptime Kuma (plain "ok" from Astro).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-shelf
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  shelf.yaml: |
    version: 1
    metadata:
      name: shelf-proxy
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: provider-shelf
        state: present
        identifiers:
          name: Shelf
        attrs:
          name: Shelf
          mode: proxy
          external_host: https://shelf.lab.jacobdrury.com
          internal_host: http://shelf-web.shelf.svc.cluster.local:4321
          internal_host_ssl_validation: false
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          access_token_validity: days=30
          refresh_token_validity: days=90
          skip_path_regex: |
            ^/health$

      - model: authentik_core.application
        id: app-shelf
        state: present
        identifiers:
          slug: shelf
        attrs:
          name: Shelf
          slug: shelf
          provider: !KeyOf provider-shelf
          policy_engine_mode: any
          meta_launch_url: https://shelf.lab.jacobdrury.com

      - model: authentik_outposts.outpost
        id: outpost-embedded
        state: present
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          # Keep every Proxy Provider on the embedded outpost.
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, Uptime Kuma]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, Sonarr Anime]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, Sonarr TV]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, Prowlarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, qBittorrent]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, Cleanuparr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, Unmanic]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, Pi-hole]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, Shelf]]
