# Authentik blueprint — Pi-hole Proxy Provider (admin UI).
# Traffic: Envoy pihole.lab → authentik-server → pihole.pihole.svc:80
# LAN DNS still LXC until DHCP cutover — docs/architecture/pihole.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-pihole
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  pihole.yaml: |
    version: 1
    metadata:
      name: pihole-proxy
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: provider-pihole
        state: present
        identifiers:
          name: Pi-hole
        attrs:
          name: Pi-hole
          mode: proxy
          external_host: https://pihole.lab.jacobdrury.com
          internal_host: http://pihole.pihole.svc.cluster.local:80
          internal_host_ssl_validation: false
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          # No skip_path — Pi-hole has no web password; do not expose /api publicly.
      - model: authentik_core.application
        id: app-pihole
        state: present
        identifiers:
          slug: pihole
        attrs:
          name: Pi-hole
          slug: pihole
          provider: !KeyOf provider-pihole
          policy_engine_mode: any
          meta_launch_url: https://pihole.lab.jacobdrury.com/admin/

      - model: authentik_outposts.outpost
        id: outpost-embedded
        state: present
        identifiers:
          name: authentik Embedded Outpost
        attrs:
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, Uptime Kuma]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, Sonarr Anime]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, Sonarr TV]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, Prowlarr]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, qBittorrent]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, Pi-hole]]
