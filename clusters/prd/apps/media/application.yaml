# Media stack — qBittorrent (+ Mullvad WG sidecar), Sonarr ×2, Prowlarr, Jellyfin.
# Download UIs via Authentik Proxy; Jellyfin is Envoy → Service (native auth).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/jacobdrury/homelab.git
    targetRevision: main
    path: clusters/prd/apps/media
    directory:
      include: '{namespace,storage,media-pg,qbittorrent,sonarr-anime,sonarr-tv,prowlarr,jellyfin}.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
