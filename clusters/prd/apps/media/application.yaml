# Media stack — qBittorrent (+ Mullvad WG sidecar), Sonarr ×2, Prowlarr, Jellyfin, Seerr, Cleanuparr, Unmanic, Recyclarr.
# Download UIs via Authentik Proxy; Jellyfin/Seerr are Envoy → Service (native auth).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/jacobdrury/homelab.git
    targetRevision: main
    path: clusters/prd/apps/media
    directory:
      include: '{namespace,storage,media-pg,qbittorrent,qbittorrent-configure,sonarr-anime,sonarr-anime-configure,sonarr-tv,sonarr-tv-configure,prowlarr,prowlarr-configure,jellyfin,seerr,seerr-configure,cleanuparr,cleanuparr-configure,unmanic,unmanic-configure,recyclarr}.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  # Allow live `kubectl scale` of Unmanic without self-heal fighting it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: unmanic
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
