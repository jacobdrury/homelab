# Static NFS → existing scarif media parent (not dynamic scarif-nfs subdirs).
# One PV for /mnt/disks/ZXA0VZBA/media so anime/tv/downloads share a filesystem
# and Sonarr can hardlink imports. Server: scarif-direct.lab.jacobdrury.com.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media
  labels:
    homelab.jacobdrury.com/media: parent
spec:
  capacity:
    storage: 20Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: scarif-nfs-media
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: scarif-media
    volumeAttributes:
      server: scarif-direct.lab.jacobdrury.com
      share: /mnt/disks/ZXA0VZBA/media
  claimRef:
    namespace: media
    name: media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: scarif-nfs-media
  volumeName: media
  resources:
    requests:
      storage: 20Ti
---
# Binding-only class for static media PVs (no dynamic provisioning intended).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: scarif-nfs-media
  labels:
    homelab.jacobdrury.com/backend: scarif-nfs-static
provisioner: nfs.csi.k8s.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: false
