# Prowlarr — config copied from arr VM.
# Postgres: media-pg (prowlarr_main / prowlarr_log).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: scarif-iscsi
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: media
  labels:
    app.kubernetes.io/name: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 100
      initContainers:
        - name: ensure-postgres-config
          image: docker.io/library/alpine:3.20.3@sha256:029a752048e32e843bd6defe3841186fb8d19a28dae8ec287f433bb9d6d1ad85
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              apk add --no-cache python3 >/dev/null
              python3 /scripts/ensure-postgres-config.py
              chown -R 99:100 /config
          env:
            - name: POSTGRES_HOST
              value: media-pg-rw.media.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_MAIN_DB
              value: prowlarr_main
            - name: POSTGRES_LOG_DB
              value: prowlarr_log
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: media-pg-owner
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-pg-owner
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
            - name: pg-scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.4.0@sha256:a8d9366f65212153924de8a1b92a24f3be678b650c7e0cbb0606d4651d2b34ec
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "99"
            - name: PGID
              value: "100"
            - name: TZ
              value: America/Chicago
          ports:
            - name: http
              containerPort: 9696
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
        - name: pg-scripts
          configMap:
            name: arr-postgres-config
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: media
spec:
  selector:
    app.kubernetes.io/name: prowlarr
  ports:
    - name: http
      port: 9696
      targetPort: http
