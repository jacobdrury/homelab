# Seerr — media requests (Jellyfin + Sonarr ×2). Postgres on media-pg.
# Lab URL: Envoy → Service (Jellyfin / local auth; not Authentik Proxy).
# https://docs.seerr.dev/
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seerr-settings-config
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  ensure-settings.py: |
    #!/usr/bin/env python3
    """Ensure applicationUrl + trustProxy for Envoy (HTTPS) reverse proxy."""
    import json
    import os
    from pathlib import Path

    conf = Path(os.environ.get("SETTINGS_JSON", "/app/config/settings.json"))
    conf.parent.mkdir(parents=True, exist_ok=True)

    data = {}
    if conf.exists():
        data = json.loads(conf.read_text() or "{}")

    main = data.setdefault("main", {})
    main["applicationUrl"] = os.environ["APPLICATION_URL"]
    # Do not pre-set mediaServerType — that breaks the Jellyfin setup wizard
    # (empty hostname → library sync fails). seerr#2859 only matters on a
    # brand-new empty DB; migrations already exist in this lab.

    network = data.setdefault("network", {})
    network["trustProxy"] = True

    conf.write_text(json.dumps(data, indent=2) + "\n")
    for path in [conf.parent, *conf.parent.rglob("*")]:
        os.chown(path, 1000, 1000)
    print(f"network settings ensured in {conf}")
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: scarif-iscsi
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: media
  labels:
    app.kubernetes.io/name: seerr
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seerr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seerr
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: ensure-settings
          image: docker.io/library/python:3.12.7-alpine@sha256:5049c050bdc68575a10bcb1885baa0689b6c15152d8a56a7e399fb49f783bf98
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /scripts/ensure-settings.py
          env:
            - name: APPLICATION_URL
              value: https://seerr.lab.jacobdrury.com
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: settings-scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.5.0@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          env:
            - name: TZ
              value: America/Chicago
            - name: LOG_LEVEL
              value: info
            - name: DB_TYPE
              value: postgres
            - name: DB_HOST
              value: media-pg-rw.media.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: seerr
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: media-pg-owner
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: media-pg-owner
                  key: password
            - name: DB_USE_SSL
              value: "false"
          ports:
            - name: http
              containerPort: 5055
          volumeMounts:
            - name: config
              mountPath: /app/config
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config
        - name: settings-scripts
          configMap:
            name: seerr-settings-config
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: media
  labels:
    app.kubernetes.io/name: seerr
spec:
  selector:
    app.kubernetes.io/name: seerr
  ports:
    - name: http
      port: 5055
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - seerr.lab.jacobdrury.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: seerr
          port: 5055
          weight: 1
