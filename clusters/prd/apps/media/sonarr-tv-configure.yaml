# Idempotent Sonarr TV API configure (PostSync).
# Root folder, qBit download client, hardlinks, naming, and public URL.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-tv-bootstrap
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sonarr-tv-bootstrap
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: pga43kdwm5ziscjvmu4wecr3be
        property: sonarr-tv
    - secretKey: qbittorrent-username
      remoteRef:
        key: kc62r7k7yesqbd27qx3vgcomwe
        property: username
    - secretKey: qbittorrent-password
      remoteRef:
        key: kc62r7k7yesqbd27qx3vgcomwe
        property: password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarr-tv-configure-script
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  configure.py: |
    import json
    import os
    import time
    import urllib.error
    import urllib.request

    B = os.environ.get("SONARR_URL", "http://sonarr-tv.media.svc.cluster.local:8990")
    API_KEY = os.environ["SONARR_API_KEY"]
    ROOT = "/home/data/tv"
    APP_URL = "https://sonarr-tv.lab.jacobdrury.com"
    TV_CATEGORY = "sonarr-tv"

    def req(method, path, data=None):
        body = None if data is None else json.dumps(data).encode()
        headers = {"X-Api-Key": API_KEY}
        if data is not None:
            headers["Content-Type"] = "application/json"
        r = urllib.request.Request(B + path, method=method, data=body, headers=headers)
        try:
            with urllib.request.urlopen(r, timeout=60) as resp:
                raw = resp.read().decode() or "{}"
                print(f"{method} {path} -> {resp.status} {raw[:240]}")
                return json.loads(raw) if raw.strip() else {}
        except urllib.error.HTTPError as e:
            err = e.read().decode()
            print(f"{method} {path} -> {e.code} {err[:800]}")
            raise

    def set_field(fields, name, value):
        for f in fields:
            if f.get("name") == name:
                f["value"] = value
                return
        fields.append({"name": name, "value": value})

    for _ in range(60):
        try:
            req("GET", "/api/v3/system/status")
            break
        except Exception:
            time.sleep(2)
    else:
        raise SystemExit("sonarr-tv not ready")

    roots = req("GET", "/api/v3/rootfolder")
    if not any(r.get("path") == ROOT for r in roots):
        req("POST", "/api/v3/rootfolder", {"path": ROOT})
    else:
        print(f"rootfolder {ROOT} exists")

    clients = req("GET", "/api/v3/downloadclient")
    qbit = next((c for c in clients if c.get("name") == "qBittorrent"), None)
    if qbit is None:
        schema = next(
            s
            for s in req("GET", "/api/v3/downloadclient/schema")
            if s.get("implementation") == "QBittorrent"
        )
        qbit = dict(schema)
        qbit["name"] = "qBittorrent"
        qbit["enable"] = True
        qbit["priority"] = 1
        qbit["removeCompletedDownloads"] = True
        qbit["removeFailedDownloads"] = True
        qbit["tags"] = []

    fields = qbit.setdefault("fields", [])
    set_field(fields, "host", "qbittorrent.media.svc.cluster.local")
    set_field(fields, "port", 8080)
    set_field(fields, "useSsl", False)
    set_field(fields, "urlBase", "")
    set_field(fields, "username", os.environ["QBITTORRENT_USERNAME"])
    set_field(fields, "password", os.environ["QBITTORRENT_PASSWORD"])
    set_field(fields, "tvCategory", TV_CATEGORY)
    set_field(fields, "recentTvPriority", 0)
    set_field(fields, "olderTvPriority", 0)
    qbit["enable"] = True
    qbit["priority"] = 1
    qbit["removeCompletedDownloads"] = True
    qbit["removeFailedDownloads"] = True

    if qbit.get("id"):
        req("PUT", f"/api/v3/downloadclient/{qbit['id']}", qbit)
    else:
        req("POST", "/api/v3/downloadclient", qbit)

    host = req("GET", "/api/v3/config/host")
    host["applicationUrl"] = APP_URL
    host["authenticationMethod"] = "external"
    host["authenticationRequired"] = "disabledForLocalAddresses"
    # Required when Authentication Required is not Enabled.
    host["allowedHosts"] = "sonarr-tv.lab.jacobdrury.com,sonarr-tv.media.svc.cluster.local"
    req("PUT", "/api/v3/config/host", host)

    mm = req("GET", "/api/v3/config/mediamanagement")
    mm["copyUsingHardlinks"] = True
    mm["enableMediaInfo"] = True
    mm["downloadPropersAndRepacks"] = "preferAndUpgrade"
    mm["importExtraFiles"] = False
    req("PUT", "/api/v3/config/mediamanagement", mm)

    naming = req("GET", "/api/v3/config/naming")
    naming.update(
        {
            "renameEpisodes": True,
            "replaceIllegalCharacters": True,
            "colonReplacementFormat": 4,
            "customColonReplacementFormat": "",
            "multiEpisodeStyle": 5,
            "standardEpisodeFormat": "{Series TitleYear} - S{season:00}E{episode:00} - {Episode CleanTitle} [{Custom Formats }{Quality Full}]{[MediaInfo VideoDynamicRangeType]}{[Mediainfo AudioCodec}{ Mediainfo AudioChannels]}{[MediaInfo VideoCodec]}{-Release Group}",
            "dailyEpisodeFormat": "{Series TitleYear} - {Air-Date} - {Episode CleanTitle} [{Custom Formats }{Quality Full}]{[MediaInfo VideoDynamicRangeType]}{[Mediainfo AudioCodec}{ Mediainfo AudioChannels]}{[MediaInfo VideoCodec]}{-Release Group}",
            "animeEpisodeFormat": "{Series TitleYear} - S{season:00}E{episode:00} - {absolute:000} - {Episode CleanTitle} [{Custom Formats }{Quality Full}]{[MediaInfo VideoDynamicRangeType]}[{MediaInfo VideoBitDepth}bit]{[MediaInfo VideoCodec]}[{Mediainfo AudioCodec} { Mediainfo AudioChannels}]{MediaInfo AudioLanguages}{-Release Group}",
            "seriesFolderFormat": "{Series TitleYear}",
            "seasonFolderFormat": "Season {season:00}",
            "specialsFolderFormat": "Specials",
        }
    )
    req("PUT", "/api/v3/config/naming", naming)

    print("DONE")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sonarr-tv-configure
  namespace: media
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "5"
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr-tv-configure
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: docker.io/library/python:3.15.2-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
          imagePullPolicy: IfNotPresent
          command: ["python3", "/scripts/configure.py"]
          env:
            - name: SONARR_URL
              value: http://sonarr-tv.media.svc.cluster.local:8990
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sonarr-tv-bootstrap
                  key: api-key
            - name: QBITTORRENT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sonarr-tv-bootstrap
                  key: qbittorrent-username
            - name: QBITTORRENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarr-tv-bootstrap
                  key: qbittorrent-password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: scripts
          configMap:
            name: sonarr-tv-configure-script
