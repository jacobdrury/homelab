# Idempotent Prowlarr API configure (PostSync).
# Sonarr apps (fullSync), public indexers, then sync indexers into Sonarr.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr-bootstrap
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: prowlarr-bootstrap
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: pga43kdwm5ziscjvmu4wecr3be
        property: prowlarr
    - secretKey: sonarr-anime-api-key
      remoteRef:
        key: pga43kdwm5ziscjvmu4wecr3be
        property: sonarr-anime
    - secretKey: sonarr-tv-api-key
      remoteRef:
        key: pga43kdwm5ziscjvmu4wecr3be
        property: sonarr-tv
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prowlarr-configure-script
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  configure.py: |
    import json
    import os
    import time
    import urllib.error
    import urllib.request

    B = os.environ.get("PROWLARR_URL", "http://prowlarr.media.svc.cluster.local:9696")
    API_KEY = os.environ["PROWLARR_API_KEY"]
    PROWLARR_PUBLIC = "http://prowlarr.media.svc.cluster.local:9696"

    APPS = [
        {
            "name": "Sonarr Anime",
            "baseUrl": "http://sonarr-anime.media.svc.cluster.local:8989",
            "apiKeyEnv": "SONARR_ANIME_API_KEY",
            "syncCategories": [],
            "animeSyncCategories": [5070],
        },
        {
            "name": "Sonarr TV",
            "baseUrl": "http://sonarr-tv.media.svc.cluster.local:8990",
            "apiKeyEnv": "SONARR_TV_API_KEY",
            "syncCategories": [5000, 5010, 5020, 5030, 5040, 5045, 5050, 5060, 5080, 5090],
            "animeSyncCategories": [],
        },
    ]

    INDEXERS = [
        {"name": "Nyaa.si", "definitionName": "nyaasi", "implementation": "Cardigann", "priority": 1},
        {"name": "SubsPlease", "definitionName": "SubsPlease", "implementation": "SubsPlease", "priority": 10},
        {"name": "EZTV", "definitionName": "eztv", "implementation": "Cardigann", "priority": 25},
        {"name": "TheRARBG", "definitionName": "therarbg", "implementation": "Cardigann", "priority": 25},
        {"name": "Shana Project", "definitionName": "shanaproject", "implementation": "Cardigann", "priority": 30},
    ]

    def req(method, path, data=None):
        body = None if data is None else json.dumps(data).encode()
        headers = {"X-Api-Key": API_KEY}
        if data is not None:
            headers["Content-Type"] = "application/json"
        r = urllib.request.Request(B + path, method=method, data=body, headers=headers)
        try:
            with urllib.request.urlopen(r, timeout=120) as resp:
                raw = resp.read().decode() or "{}"
                print(f"{method} {path} -> {resp.status} {raw[:240]}")
                return json.loads(raw) if raw.strip() else {}
        except urllib.error.HTTPError as e:
            err = e.read().decode()
            print(f"{method} {path} -> {e.code} {err[:800]}")
            raise

    def set_field(fields, name, value):
        for f in fields:
            if f.get("name") == name:
                f["value"] = value
                return
        fields.append({"name": name, "value": value})

    for _ in range(60):
        try:
            req("GET", "/api/v1/system/status")
            break
        except Exception:
            time.sleep(2)
    else:
        raise SystemExit("prowlarr not ready")

    host = req("GET", "/api/v1/config/host")
    host["applicationUrl"] = "https://prowlarr.lab.jacobdrury.com"
    host["authenticationMethod"] = "external"
    host["authenticationRequired"] = "disabledForLocalAddresses"
    # Prowlarr requires AllowedHosts when auth is not fully Enabled.
    host["allowedHosts"] = "prowlarr.lab.jacobdrury.com,prowlarr.media.svc.cluster.local"
    req("PUT", "/api/v1/config/host", host)

    profiles = req("GET", "/api/v1/appprofile")
    app_profile_id = next((p["id"] for p in profiles if p.get("name") == "Standard"), profiles[0]["id"])

    apps = req("GET", "/api/v1/applications")
    schemas = None
    for desired in APPS:
        app = next((a for a in apps if a.get("name") == desired["name"]), None)
        if app is None:
            if schemas is None:
                schemas = req("GET", "/api/v1/applications/schema")
            schema = next(s for s in schemas if s.get("implementation") == "Sonarr")
            app = dict(schema)
            app["name"] = desired["name"]
            app["tags"] = []
        fields = app.setdefault("fields", [])
        set_field(fields, "prowlarrUrl", PROWLARR_PUBLIC)
        set_field(fields, "baseUrl", desired["baseUrl"])
        set_field(fields, "apiKey", os.environ[desired["apiKeyEnv"]])
        set_field(fields, "syncCategories", desired["syncCategories"])
        set_field(fields, "animeSyncCategories", desired["animeSyncCategories"])
        set_field(fields, "syncAnimeStandardFormatSearch", True)
        set_field(fields, "syncRejectBlocklistedTorrentHashesWhileGrabbing", False)
        app["enable"] = True
        app["syncLevel"] = "fullSync"
        if app.get("id"):
            req("PUT", f"/api/v1/applications/{app['id']}?forceSave=true", app)
        else:
            req("POST", "/api/v1/applications?forceSave=true", app)

    indexers = req("GET", "/api/v1/indexer")
    indexer_schemas = None
    for desired in INDEXERS:
        idx = next((i for i in indexers if i.get("name") == desired["name"]), None)
        if idx is None:
            if indexer_schemas is None:
                indexer_schemas = req("GET", "/api/v1/indexer/schema")
            schema = next(
                s
                for s in indexer_schemas
                if s.get("definitionName") == desired["definitionName"]
                or (
                    desired["implementation"] == "SubsPlease"
                    and s.get("implementation") == "SubsPlease"
                )
            )
            idx = dict(schema)
            idx["name"] = desired["name"]
            idx["tags"] = []
        idx["enable"] = True
        idx["priority"] = desired["priority"]
        idx["appProfileId"] = app_profile_id
        fields = idx.setdefault("fields", [])
        if desired["implementation"] == "Cardigann":
            set_field(fields, "definitionFile", desired["definitionName"])
        if desired["name"] == "SubsPlease":
            set_field(fields, "baseUrl", "https://subsplease.org/")
        if idx.get("id"):
            # forceSave skips live site checks (e.g. EZTV CloudFlare blocks).
            req("PUT", f"/api/v1/indexer/{idx['id']}?forceSave=true", idx)
        else:
            req("POST", "/api/v1/indexer?forceSave=true", idx)

    # Re-PUT apps so fullSync pushes indexers into Sonarr after indexer upserts.
    apps = req("GET", "/api/v1/applications")
    for app in apps:
        if app.get("name") not in {a["name"] for a in APPS}:
            continue
        req("PUT", f"/api/v1/applications/{app['id']}?forceSave=true", app)

    print("DONE")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: prowlarr-configure
  namespace: media
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "6"
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr-configure
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: docker.io/library/python:3.15.2-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
          imagePullPolicy: IfNotPresent
          command: ["python3", "/scripts/configure.py"]
          env:
            - name: PROWLARR_URL
              value: http://prowlarr.media.svc.cluster.local:9696
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: prowlarr-bootstrap
                  key: api-key
            - name: SONARR_ANIME_API_KEY
              valueFrom:
                secretKeyRef:
                  name: prowlarr-bootstrap
                  key: sonarr-anime-api-key
            - name: SONARR_TV_API_KEY
              valueFrom:
                secretKeyRef:
                  name: prowlarr-bootstrap
                  key: sonarr-tv-api-key
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              # Indexer schema payload is multi-MB JSON.
              memory: 512Mi
      volumes:
        - name: scripts
          configMap:
            name: prowlarr-configure-script
