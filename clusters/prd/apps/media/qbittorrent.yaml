# qBittorrent + Mullvad WireGuard sidecar (peers on wg0; UI on eth0).
# Homelab item "prd Mullvad WireGuard" — password field = full Mullvad wg0.conf.
# Prefer Table = off in the conf so wg-quick does not steal the pod default route.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-mullvad
  namespace: media
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Do not block the rest of the media app while 1Password item is still a stub.
    argocd.argoproj.io/sync-options: SkipResourceHealthCheck=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: qbittorrent-mullvad
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        wg0.conf: "{{ .config }}"
  data:
    - secretKey: config
      remoteRef:
        key: 4sdxng7xkixk5duojeo5okwwxq
        property: password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: scarif-iscsi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      # naboo intentionally down — pin to CP until Phase 4 capacity.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: wireguard
          image: lscr.io/linuxserver/wireguard:1.0.20260223-r0-ls122@sha256:d6de09f9e9a2398446a3e951e278da930dd254c05d842755a10a6079d8b7b8aa
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              conf=/tmp/wg0.conf
              cp /mullvad/wg0.conf "$conf"
              chmod 600 "$conf"
              # Bind-to-wg0 mode: do not replace the pod default route (keeps UI/DNS on eth0).
              if ! grep -qE '^[[:space:]]*Table[[:space:]]*=' "$conf"; then
                sed -i '/^\[Interface\]/a Table = off' "$conf"
              fi
              # Mullvad exports set DNS=; resolvconf then fails in this image and
              # wg-quick rolls wg0 back. Pod DNS stays on eth0 intentionally.
              sed -i -E '/^[[:space:]]*DNS[[:space:]]*=/d' "$conf"
              # NAT/k8s SNAT needs keepalive or the handshake dies quietly.
              if ! grep -qE '^[[:space:]]*PersistentKeepalive[[:space:]]*=' "$conf"; then
                printf '\nPersistentKeepalive = 25\n' >> "$conf"
              fi

              check_mullvad() {
                local hs now age body
                hs=$(wg show wg0 latest-handshakes 2>/dev/null | awk 'NR==1 {print $2}')
                if [ -z "${hs:-}" ] || [ "$hs" = "0" ]; then
                  return 1
                fi
                now=$(date +%s)
                age=$((now - hs))
                # Keepalive is 25s; treat >3m without handshake as down.
                if [ "$age" -gt 180 ]; then
                  return 1
                fi
                body=$(curl -sS --max-time 8 --interface wg0 https://am.i.mullvad.net/connected 2>/dev/null || true)
                if ! echo "$body" | grep -qi 'You are connected to Mullvad'; then
                  return 1
                fi
                return 0
              }

              # Refresh status in the background so :8081 stays accepting connections
              # while the Mullvad HTTP check (up to ~8s) runs.
              printf '503 Service Unavailable\nstarting\n' > /tmp/mullvad.health
              (
                while true; do
                  if check_mullvad; then
                    printf '200 OK\nok\n' > /tmp/mullvad.health
                  else
                    printf '503 Service Unavailable\nmullvad down\n' > /tmp/mullvad.health
                  fi
                  sleep 15
                done
              ) &

              # ClusterIP probe for Uptime Kuma (UI stays on :8080 / eth0).
              (
                while true; do
                  status=$(head -1 /tmp/mullvad.health)
                  body=$(sed -n '2p' /tmp/mullvad.health)
                  len=${#body}
                  printf 'HTTP/1.1 %s\r\nContent-Type: text/plain\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s' \
                    "$status" "$len" "$body" \
                    | nc -l -p 8081 -q 1 >/dev/null || true
                done
              ) &

              # Keep the sidecar alive even if conf is still a 1Password stub,
              # so qBit can come Ready for config copy / UI smoke.
              while true; do
                wg-quick down wg0 2>/dev/null || true
                if wg-quick up "$conf"; then
                  echo "wg0 up"
                  wg show
                  sleep infinity
                fi
                echo "wg-quick failed; retrying in 30s (check 1Password Mullvad conf)"
                sleep 30
              done
          ports:
            - name: mullvad-health
              containerPort: 8081
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
            privileged: true
          volumeMounts:
            - name: mullvad
              mountPath: /mullvad
              readOnly: true
            - name: tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.2.4@sha256:07bf154bd7d0d2450d4c4f9c2e7ca1d61566a4963b7aeb44475497935dec14f3
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "99"
            - name: PGID
              value: "100"
            - name: TZ
              value: America/Chicago
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
            # Match Compose paths used in copied qBittorrent.conf
            - name: downloads
              mountPath: /home/data/downloads
            - name: downloads
              mountPath: /downloads
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: mullvad
          secret:
            secretName: qbittorrent-mullvad
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: downloads
          persistentVolumeClaim:
            claimName: media-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  selector:
    app.kubernetes.io/name: qbittorrent
  ports:
    - name: http
      port: 8080
      targetPort: http
    # In-cluster only — Mullvad/wg0 health for Uptime Kuma (not on Authentik / public DNS).
    - name: mullvad-health
      port: 8081
      targetPort: mullvad-health
# HTTPRoute added at cutover — see httproutes.yaml (kept out of Argo include until config copy).
