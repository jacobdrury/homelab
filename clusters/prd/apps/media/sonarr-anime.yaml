# Sonarr anime — config copied from arr VM; library on NFS media/anime.
# Postgres: media-pg (sonarr_anime_main / sonarr_anime_log).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-anime-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: scarif-iscsi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr-anime
  namespace: media
  labels:
    app.kubernetes.io/name: sonarr-anime
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarr-anime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr-anime
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 100
      initContainers:
        - name: ensure-postgres-config
          image: docker.io/library/alpine:3.20.3@sha256:029a752048e32e843bd6defe3841186fb8d19a28dae8ec287f433bb9d6d1ad85
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              apk add --no-cache python3 >/dev/null
              python3 /scripts/ensure-postgres-config.py
              chown -R 99:100 /config
          env:
            - name: POSTGRES_HOST
              value: media-pg-rw.media.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_MAIN_DB
              value: sonarr_anime_main
            - name: POSTGRES_LOG_DB
              value: sonarr_anime_log
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: media-pg-owner
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-pg-owner
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
            - name: pg-scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.19@sha256:64e9c8a2315516837fd809d53e2d2006bf8a17787754dc6474d2c5964d862f6e
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "99"
            - name: PGID
              value: "100"
            - name: TZ
              value: America/Chicago
          ports:
            - name: http
              containerPort: 8989
          volumeMounts:
            - name: config
              mountPath: /config
            - name: anime
              mountPath: /home/data/anime
            - name: downloads
              mountPath: /home/data/downloads
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-anime-config
        - name: anime
          persistentVolumeClaim:
            claimName: media-anime
        - name: downloads
          persistentVolumeClaim:
            claimName: media-downloads
        - name: pg-scripts
          configMap:
            name: arr-postgres-config
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr-anime
  namespace: media
spec:
  selector:
    app.kubernetes.io/name: sonarr-anime
  ports:
    - name: http
      port: 8989
      targetPort: http
