apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: homepage
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab
      namespace: envoy-gateway-system
      sectionName: https-apex
  hostnames:
    - lab.jacobdrury.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: homepage
          port: 3000
          weight: 1
---
# Token: Homelab item "prd Homepage Argo CD API token" (password field).
# Generated for Argo local account "homepage" (apiKey + role:readonly).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-argocd
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-argocd
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: gzuoplg3trd7mm7rpazdwbd5ki
        property: password
---
# Create key in Unraid → Settings → Management Access → API Keys (ADMIN),
# paste into Homelab item "prd Homepage Unraid API key".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-unraid
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-unraid
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: 37omp6yhyvdum6g63u6tsfkhk4
        property: password
---
# Homelab item "prd Homepage media API keys" (jellyfin / sonarr-anime / sonarr-tv / prowlarr).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-media
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-media
    creationPolicy: Owner
  data:
    - secretKey: jellyfin
      remoteRef:
        key: pga43kdwm5ziscjvmu4wecr3be
        property: jellyfin
    - secretKey: sonarr-anime
      remoteRef:
        key: pga43kdwm5ziscjvmu4wecr3be
        property: sonarr-anime
    - secretKey: sonarr-tv
      remoteRef:
        key: pga43kdwm5ziscjvmu4wecr3be
        property: sonarr-tv
    - secretKey: prowlarr
      remoteRef:
        key: pga43kdwm5ziscjvmu4wecr3be
        property: prowlarr
---
# Homelab item "qBittorrent" (username / password).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-qbittorrent
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-qbittorrent
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: kc62r7k7yesqbd27qx3vgcomwe
        property: username
    - secretKey: password
      remoteRef:
        key: kc62r7k7yesqbd27qx3vgcomwe
        property: password
---
# Homelab item "prd Homepage Authentik API token" (API Token intent for user jacob).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-authentik
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-authentik
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: isf3ugsheo5s6fsb55tecwvlie
        property: password
---
# Homelab item "Unifi API Key (opentofu-homelab)" — Network Integrations API key (same as OpenTofu).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-unifi
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-unifi
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: bqbnkqxcyyg6h72orwebvozdjm
        property: credential
