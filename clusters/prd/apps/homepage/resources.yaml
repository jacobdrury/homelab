apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: homepage
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Homepage
    gethomepage.dev/description: Homelab dashboard
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: homepage.png
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - homepage.lab.jacobdrury.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: homepage
          port: 3000
          weight: 1
