apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: homepage
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab
      namespace: envoy-gateway-system
      sectionName: https-apex
  hostnames:
    - lab.jacobdrury.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: homepage
          port: 3000
          weight: 1
---
# Token: Homelab item "prd Homepage Argo CD API token" (password field).
# Generated for Argo local account "homepage" (apiKey + role:readonly).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-argocd
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-argocd
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: prd Homepage Argo CD API token
        property: password
