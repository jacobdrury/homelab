image:
  repository: ghcr.io/gethomepage/homepage
  tag: v2.3.0

enableRbac: true

serviceAccount:
  create: true
  name: homepage

service:
  main:
    ports:
      http:
        port: 3000

controller:
  strategy: RollingUpdate

ingress:
  main:
    enabled: false

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: lab.jacobdrury.com
  - name: TZ
    value: America/Chicago
  - name: HOMEPAGE_VAR_ARGOCD_API_KEY
    valueFrom:
      secretKeyRef:
        name: homepage-argocd
        key: api-key
  - name: HOMEPAGE_VAR_UNRAID_API_KEY
    valueFrom:
      secretKeyRef:
        name: homepage-unraid
        key: api-key
  - name: HOMEPAGE_VAR_PIHOLE_API_KEY
    valueFrom:
      secretKeyRef:
        name: homepage-pihole
        key: api-key
  - name: HOMEPAGE_VAR_JELLYFIN_KEY
    valueFrom:
      secretKeyRef:
        name: homepage-media
        key: jellyfin
  - name: HOMEPAGE_VAR_SONARR_ANIME_KEY
    valueFrom:
      secretKeyRef:
        name: homepage-media
        key: sonarr-anime
  - name: HOMEPAGE_VAR_SONARR_TV_KEY
    valueFrom:
      secretKeyRef:
        name: homepage-media
        key: sonarr-tv
  - name: HOMEPAGE_VAR_PROWLARR_KEY
    valueFrom:
      secretKeyRef:
        name: homepage-media
        key: prowlarr
  - name: HOMEPAGE_VAR_QBITTORRENT_USERNAME
    valueFrom:
      secretKeyRef:
        name: homepage-qbittorrent
        key: username
  - name: HOMEPAGE_VAR_QBITTORRENT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: homepage-qbittorrent
        key: password
  - name: HOMEPAGE_VAR_PROXMOX_USERNAME
    valueFrom:
      secretKeyRef:
        name: homepage-proxmox
        key: username
  - name: HOMEPAGE_VAR_PROXMOX_PASSWORD
    valueFrom:
      secretKeyRef:
        name: homepage-proxmox
        key: password
  - name: HOMEPAGE_VAR_AUTHENTIK_KEY
    valueFrom:
      secretKeyRef:
        name: homepage-authentik
        key: api-key
  - name: HOMEPAGE_VAR_UNIFI_API_KEY
    valueFrom:
      secretKeyRef:
        name: homepage-unifi
        key: api-key

config:
  kubernetes:
    mode: cluster
    gateway: true

  settingsString: |
    title: Homelab
    description: lab.jacobdrury.com
    # Kubernetes widget is relocated to the footer via custom.css.
    headerStyle: clean
    theme: dark
    color: slate
    target: _blank
    hideVersion: true
    statusStyle: dot
    layout:
      Platform:
        style: column
      Media:
        style: column
      Home:
        style: column
      Network:
        style: column
      Infrastructure:
        style: column

  services:
    - Platform:
        - Argo CD:
            href: https://argocd.lab.jacobdrury.com
            description: GitOps
            # walkxcode dashboard-icons uses argo-cd.png (argocd.png 404s)
            icon: argo-cd.png
            siteMonitor: https://argocd.lab.jacobdrury.com
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc
              key: "{{HOMEPAGE_VAR_ARGOCD_API_KEY}}"
              fields:
                - synced
                - outOfSync
                - healthy
                - degraded
        - Uptime Kuma:
            href: https://uptime.lab.jacobdrury.com/status/default
            description: Status monitors (Authentik proxy)
            icon: uptime-kuma.png
            siteMonitor: https://uptime.lab.jacobdrury.com/status/default
            widget:
              type: uptimekuma
              # Base URL only — Homepage appends /api/status-page/<slug>.
              # Status-page API is on Authentik skip_path (public).
              url: https://uptime.lab.jacobdrury.com
              slug: default
              fields:
                - up
                - down
                - uptime
        - Authentik:
            href: https://auth.lab.jacobdrury.com
            description: SSO / IdP
            icon: authentik.png
            siteMonitor: https://auth.lab.jacobdrury.com
            widget:
              type: authentik
              # In-cluster API; token needs view User + Event (admin jacob).
              url: http://authentik-server.authentik.svc.cluster.local
              key: "{{HOMEPAGE_VAR_AUTHENTIK_KEY}}"
              version: 2
              fields:
                - users
                - loginsLast24H
                - failedLoginsLast24H
                - authorizationsLast24H

    - Media:
        - Jellyfin:
            href: https://jellyfin.lab.jacobdrury.com
            description: Media
            icon: jellyfin.png
            widget:
              type: jellyfin
              url: https://jellyfin.lab.jacobdrury.com
              key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
              enableBlocks: true
              enableNowPlaying: true
              fields:
                - series
                - episodes
        - qBittorrent:
            href: https://qbittorrent.lab.jacobdrury.com
            description: Downloads
            icon: qbittorrent.png
            widget:
              type: qbittorrent
              url: https://qbittorrent.lab.jacobdrury.com
              username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
              password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
              fields:
                - leech
                - download
        - Sonarr Anime:
            href: https://sonarr.lab.jacobdrury.com
            description: Anime
            icon: sonarr.png
            widget:
              type: sonarr
              url: https://sonarr.lab.jacobdrury.com
              key: "{{HOMEPAGE_VAR_SONARR_ANIME_KEY}}"
              fields:
                - wanted
                - queued
                - series
        - Sonarr TV:
            href: https://sonarr-tv.lab.jacobdrury.com
            description: TV
            icon: sonarr.png
            widget:
              type: sonarr
              url: https://sonarr-tv.lab.jacobdrury.com
              key: "{{HOMEPAGE_VAR_SONARR_TV_KEY}}"
              fields:
                - wanted
                - queued
                - series
        - Prowlarr:
            href: https://prowlarr.lab.jacobdrury.com
            description: Indexers
            icon: prowlarr.png
            widget:
              type: prowlarr
              url: https://prowlarr.lab.jacobdrury.com
              key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
              fields:
                - numberOfGrabs
                - numberOfQueries
                - numberOfFailGrabs
                - numberOfFailQueries

    - Home:
        - Home Assistant:
            href: https://homeassistant.lab.jacobdrury.com
            description: Home automation
            icon: home-assistant.png
            siteMonitor: https://homeassistant.lab.jacobdrury.com

    - Infrastructure:
        - UniFi:
            href: https://192.168.1.1
            description: UDM Pro (Drury)
            icon: unifi.png
            siteMonitor: https://192.168.1.1
            widget:
              type: unifi
              url: https://192.168.1.1
              # Same Network Integrations API key as OpenTofu (Homelab item).
              key: "{{HOMEPAGE_VAR_UNIFI_API_KEY}}"
              fields:
                - uptime
                - wan
                - lan_users
                - wlan_users
        - Pi-hole:
            href: https://pihole.lab.jacobdrury.com/admin/
            description: DNS / adblock (transitional)
            icon: pi-hole.png
            siteMonitor: https://pihole.lab.jacobdrury.com/admin/
            widget:
              type: pihole
              url: https://pihole.lab.jacobdrury.com
              version: 6
              key: "{{HOMEPAGE_VAR_PIHOLE_API_KEY}}"
        - scarif:
            href: https://scarif.lab.jacobdrury.com
            description: Unraid NAS
            icon: unraid.png
            siteMonitor: https://scarif.lab.jacobdrury.com/login
            widget:
              type: unraid
              url: https://scarif.lab.jacobdrury.com
              key: "{{HOMEPAGE_VAR_UNRAID_API_KEY}}"
              # ZFS appdata pool on scarif (array may be empty).
              pool1: scarif-ssd
              fields:
                - status
                - cpu
                - memoryPercent
                - pool1UsedPercent
        - Proxmox:
            href: https://proxmox.lab.jacobdrury.com
            description: homelab02 (arr host)
            icon: proxmox.png
            siteMonitor: https://proxmox.lab.jacobdrury.com
            widget:
              type: proxmox
              url: https://proxmox.lab.jacobdrury.com
              username: "{{HOMEPAGE_VAR_PROXMOX_USERNAME}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_PASSWORD}}"
              node: homelab02
              fields:
                - vms
                - lxc
                - resources.cpu
                - resources.mem

  # Kubernetes widget (relocated to footer via custom.css). Needs metrics-server.
  widgets:
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "prd"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  bookmarks: []
  docker: {}

# Homepage has no native footer info-widget slot; pin kubernetes into the bottom bar.
configMaps:
  custom:
    enabled: true
    data:
      custom.css: |
        /* Theme/color are locked in settings.yaml; hide remaining footer chrome. */
        #revalidate {
          display: none !important;
        }

        #footer {
          position: fixed !important;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 50;
          margin-top: 0 !important;
          padding: 0.75rem 2rem !important;
          background: transparent;
          pointer-events: none;
        }

        /* Pin kubernetes info widgets into the footer bar. */
        #information-widgets {
          position: fixed !important;
          left: 50%;
          transform: translateX(-50%);
          bottom: 0.55rem;
          z-index: 45;
          margin: 0 !important;
          padding: 0 !important;
          border: none !important;
          width: max-content;
          max-width: calc(100vw - 4rem);
          pointer-events: none;
        }

        #information-widgets #widgets-wrap {
          justify-content: center !important;
          width: auto !important;
          flex-wrap: nowrap !important;
          gap: 1.25rem !important;
          pointer-events: auto;
        }

        #information-widgets .widget-container {
          pointer-events: auto;
        }

        #information-widgets-right {
          display: none !important;
        }

        .container.relative.m-auto.flex.flex-col.justify-start.z-10.h-full.min-h-screen {
          padding-bottom: 5.5rem !important;
        }

persistence:
  logs:
    enabled: true
    type: emptyDir
    mountPath: /app/config/logs
  custom-css:
    enabled: true
    type: configMap
    name: homepage-custom
    mountPath: /app/config/custom.css
    subPath: custom.css

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi
