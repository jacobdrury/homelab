image:
  repository: ghcr.io/gethomepage/homepage
  tag: v2.3.0

enableRbac: true

serviceAccount:
  create: true
  name: homepage

service:
  main:
    ports:
      http:
        port: 3000

controller:
  strategy: RollingUpdate

ingress:
  main:
    enabled: false

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: lab.jacobdrury.com
  - name: TZ
    value: America/Chicago
  - name: HOMEPAGE_VAR_ARGOCD_API_KEY
    valueFrom:
      secretKeyRef:
        name: homepage-argocd
        key: api-key
  - name: HOMEPAGE_VAR_UNRAID_API_KEY
    valueFrom:
      secretKeyRef:
        name: homepage-unraid
        key: api-key
  - name: HOMEPAGE_VAR_PIHOLE_API_KEY
    valueFrom:
      secretKeyRef:
        name: homepage-pihole
        key: api-key

config:
  kubernetes:
    mode: cluster
    gateway: true

  settingsString: |
    title: Homelab
    description: lab.jacobdrury.com
    # Empty info-widgets strip is from headerStyle boxed; none removes it.
    headerStyle: none
    target: _blank
    hideVersion: true
    statusStyle: dot
    layout:
      Platform:
        style: column
      Media:
        style: column
      Home:
        style: column
      Infrastructure:
        style: column

  services:
    - Platform:
        - Argo CD:
            href: https://argocd.lab.jacobdrury.com
            description: GitOps
            # walkxcode dashboard-icons uses argo-cd.png (argocd.png 404s)
            icon: argo-cd.png
            siteMonitor: https://argocd.lab.jacobdrury.com
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc
              key: "{{HOMEPAGE_VAR_ARGOCD_API_KEY}}"
              fields:
                - synced
                - outOfSync
                - healthy
                - degraded

    - Media:
        - Jellyfin:
            href: https://jellyfin.lab.jacobdrury.com
            description: Media (transitional → arr)
            icon: jellyfin.png
        - qBittorrent:
            href: https://qbittorrent.lab.jacobdrury.com
            description: Downloads (transitional → arr)
            icon: qbittorrent.png
        - Sonarr Anime:
            href: https://sonarr.lab.jacobdrury.com
            description: Anime (transitional → arr)
            icon: sonarr.png
        - Sonarr TV:
            href: https://sonarr-tv.lab.jacobdrury.com
            description: TV (transitional → arr)
            icon: sonarr.png
        - Prowlarr:
            href: https://prowlarr.lab.jacobdrury.com
            description: Indexers (transitional → arr)
            icon: prowlarr.png

    - Home:
        - Home Assistant:
            href: https://homeassistant.lab.jacobdrury.com
            description: Home automation (transitional)
            icon: home-assistant.png

    - Infrastructure:
        - scarif:
            href: https://scarif.lab.jacobdrury.com
            description: Unraid NAS
            icon: unraid.png
            siteMonitor: http://scarif-nfs.lab.jacobdrury.com
            widget:
              type: unraid
              # GraphQL direct to Unraid (scarif.lab is Envoy HTTPS UI).
              url: http://scarif-nfs.lab.jacobdrury.com
              key: "{{HOMEPAGE_VAR_UNRAID_API_KEY}}"
              # ZFS appdata pool on scarif (array may be empty).
              pool1: scarif-ssd
              fields:
                - status
                - cpu
                - memoryPercent
                - pool1UsedPercent
        - Pi-hole:
            href: https://pihole.lab.jacobdrury.com/admin/
            description: DNS / adblock (transitional)
            icon: pi-hole.png
            siteMonitor: http://pihole-lxc.lab.jacobdrury.com/admin/
            widget:
              type: pihole
              url: http://pihole-lxc.lab.jacobdrury.com
              version: 6
              key: "{{HOMEPAGE_VAR_PIHOLE_API_KEY}}"

  # Chart defaults include search/resources widgets; null disables them (empty [] is truthy in Helm).
  widgets: null

  bookmarks: []
  docker: {}

persistence:
  logs:
    enabled: true
    type: emptyDir
    mountPath: /app/config/logs

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi
