# Uptime Kuma — MariaDB on shared lab instance (platform/mariadb).
# Public URL is Authentik Proxy Provider.
# https://integrations.goauthentik.io/monitoring/uptime-kuma/

image:
  repository: louislam/uptime-kuma
  tag: "2.5.0"

useDeploy: true

strategy:
  type: Recreate

# Shared MariaDB — secrets from ExternalSecret uptime-kuma-mariadb.
podEnv:
  - name: UPTIME_KUMA_DB_TYPE
    value: mariadb
  - name: UPTIME_KUMA_DB_HOSTNAME
    value: mariadb.mariadb.svc.cluster.local
  - name: UPTIME_KUMA_DB_PORT
    value: "3306"
  - name: UPTIME_KUMA_DB_NAME
    valueFrom:
      secretKeyRef:
        name: uptime-kuma-mariadb
        key: database
  - name: UPTIME_KUMA_DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: uptime-kuma-mariadb
        key: username
  - name: UPTIME_KUMA_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: uptime-kuma-mariadb
        key: password

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 3001
  # Tailscale L3 expose — Socket.IO API for OpenTofu (bypasses Authentik on uptime.lab).
  # MagicDNS: uptime-kuma.<tailnet>.ts.net:3001 (see lab.yaml services.uptime_kuma).
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "uptime-kuma"
    tailscale.com/tags: "tag:k8s"

# Still needed for screenshots / local files (DB is remote).
volume:
  enabled: true
  size: 2Gi
  storageClassName: scarif-iscsi
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    memory: 512Mi
