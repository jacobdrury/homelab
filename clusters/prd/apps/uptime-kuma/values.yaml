# Uptime Kuma — SQLite on scarif-iscsi. Public URL is Authentik Proxy Provider.
# https://integrations.goauthentik.io/monitoring/uptime-kuma/

image:
  repository: louislam/uptime-kuma
  tag: "2.5.0"

useDeploy: true

strategy:
  type: Recreate

# Skip first-run DB wizard — Kuma only supports SQLite / MariaDB (not Postgres/CNPG).
podEnv:
  - name: UPTIME_KUMA_DB_TYPE
    value: sqlite

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 3001

volume:
  enabled: true
  size: 2Gi
  storageClassName: scarif-iscsi
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    memory: 512Mi
