# Homelab item "prd Uptime Kuma MariaDB" (username, password, database).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uptime-kuma-mariadb
  namespace: uptime-kuma
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: uptime-kuma-mariadb
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: prd Uptime Kuma MariaDB
        property: username
    - secretKey: password
      remoteRef:
        key: prd Uptime Kuma MariaDB
        property: password
    - secretKey: database
      remoteRef:
        key: prd Uptime Kuma MariaDB
        property: database
---
# OpenTofu / CI Socket.IO API — Tailscale L7 Ingress (bypasses Authentik).
# L7 uses Tailscale Serve and avoids the L3 DNAT path that blackholed TCP :3001.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma-api
  namespace: uptime-kuma
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    tailscale.com/tags: "tag:k8s"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - uptime-kuma
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
