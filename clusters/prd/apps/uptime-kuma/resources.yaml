# Homelab item "prd Uptime Kuma MariaDB" (username, password, database).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uptime-kuma-mariadb
  namespace: uptime-kuma
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: uptime-kuma-mariadb
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: prd Uptime Kuma MariaDB
        property: username
    - secretKey: password
      remoteRef:
        key: prd Uptime Kuma MariaDB
        property: password
    - secretKey: database
      remoteRef:
        key: prd Uptime Kuma MariaDB
        property: database
---
# OpenTofu / CI Socket.IO API — Homelab NodePort (bypasses Authentik on uptime.lab).
# Hit via Connector subnet route: http://<yavin>:<nodePort> (see lab.yaml).
# Avoids Tailscale L3 Service expose (TCP to MagicDNS :3001 times out from GHA).
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma-api
  namespace: uptime-kuma
  labels:
    app.kubernetes.io/name: uptime-kuma
    app.kubernetes.io/component: api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: uptime-kuma
    app.kubernetes.io/name: uptime-kuma
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      nodePort: 30001
      protocol: TCP
