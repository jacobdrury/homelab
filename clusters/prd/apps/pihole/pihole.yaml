# Stateless Pi-hole — Deployment replicas share ConfigMaps; gravity lives on emptyDir per pod.
# DNS: LoadBalancer 192.168.5.22 · Admin: ClusterIP → Envoy/Authentik (not nginx Ingress).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
  labels:
    app.kubernetes.io/name: pihole
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Prefer one DNS pod per node; allow both on one node if the other is down.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pihole
    spec:
      # Service named `pihole` would inject unparseable PIHOLE_PORT into the exporter.
      enableServiceLinks: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pihole
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pihole
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: pihole
          image: docker.io/pihole/pihole:2026.09.0@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
          imagePullPolicy: IfNotPresent
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pihole-settings
          readinessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: etc-pihole
              mountPath: /etc/pihole
            - name: dnsmasq
              mountPath: /etc/dnsmasq.d
              readOnly: true
        - name: config-sync
          image: docker.io/library/python:3.15.2-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
          imagePullPolicy: IfNotPresent
          command: ["python3", "/sync/sync.py"]
          env:
            - name: PIHOLE_URL
              value: http://127.0.0.1
            - name: POLICY_PATH
              value: /config/policy.json
            - name: SYNC_INTERVAL_SECONDS
              value: "60"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: sync
              mountPath: /sync
              readOnly: true
            - name: policy
              mountPath: /config
              readOnly: true
        # Per-pod metrics — query stats are ephemeral on emptyDir.
        # Official exporter: https://github.com/eko/pihole-exporter
        - name: exporter
          image: docker.io/ekofr/pihole-exporter:v1.3.1@sha256:4233c06fcd2d62c37b9345228bc9f798b3a66d052b4955ec6a0e5b8825e20827
          imagePullPolicy: IfNotPresent
          env:
            - name: PIHOLE_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PIHOLE_PROTOCOL
              value: http
            - name: PIHOLE_PORT
              value: "80"
            - name: PORT
              value: "9617"
            - name: LOG_LEVEL
              value: info
          ports:
            - name: metrics
              containerPort: 9617
              protocol: TCP
          readinessProbe:
            exec:
              command: ["./pihole-exporter", "-healthcheck"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["./pihole-exporter", "-healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: etc-pihole
          emptyDir: {}
        - name: dnsmasq
          configMap:
            name: pihole-dnsmasq
        - name: policy
          configMap:
            name: pihole-policy
        - name: sync
          configMap:
            name: pihole-sync
            defaultMode: 0555
