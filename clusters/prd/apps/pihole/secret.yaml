# Pi-hole API password — Homelab item "Pi-hole API" (LXC OpenTofu + k8s config-sync).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pihole
  namespace: pihole
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pihole
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: vezrlczecpu4bkm4tisz5gzqxm
        property: credential
