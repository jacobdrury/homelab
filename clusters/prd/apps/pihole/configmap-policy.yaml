# Policy SoT in Git — config-sync sidecar reconciles into each pod via Pi-hole v6 API.
# Migrated from infrastructure/pihole/*.auto.tfvars (LXC OpenTofu remains until DHCP cutover).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-policy
  namespace: pihole
  labels:
    app.kubernetes.io/name: pihole
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  policy.json: |
    {
      "block_lists": [
