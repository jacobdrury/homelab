# DNS VIP (.22) via Cilium L2; HTTP admin for Authentik Proxy / HTTPRoute (lab "ingress").
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns
  namespace: pihole
  labels:
    app.kubernetes.io/name: pihole
    lb-pool: pihole-dns
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.5.22
  # Cluster: VIP may announce on a different node than the pod during drains / single-node.
  externalTrafficPolicy: Cluster
  ports:
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
  selector:
    app.kubernetes.io/name: pihole
---
apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: pihole
  labels:
    app.kubernetes.io/name: pihole
    app.kubernetes.io/component: admin
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9617
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: pihole
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pihole
  namespace: pihole
  labels:
    app.kubernetes.io/name: pihole
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # Only the admin ClusterIP (not pihole-dns LoadBalancer).
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole
      app.kubernetes.io/component: admin
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
