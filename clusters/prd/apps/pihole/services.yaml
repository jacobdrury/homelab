# DNS VIP (.22) via Cilium L2; HTTP admin for Authentik Proxy / HTTPRoute (lab "ingress").
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns
  namespace: pihole
  labels:
    app.kubernetes.io/name: pihole
    lb-pool: pihole-dns
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.5.22
  # Cluster: VIP may announce on a different node than the pod during drains / single-node.
  externalTrafficPolicy: Cluster
  ports:
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
  selector:
    app.kubernetes.io/name: pihole
---
apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: pihole
  labels:
    app.kubernetes.io/name: pihole
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: pihole
