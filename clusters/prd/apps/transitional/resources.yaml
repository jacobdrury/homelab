apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: homeassistant
  namespace: transitional
spec:
  endpoints:
    - ip:
        address: 192.168.2.8
        port: 8123
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homeassistant
  namespace: transitional
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - homeassistant.lab.jacobdrury.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # HA returns 400 if it sees X-Forwarded-* without trusted_proxies.
      # Strip until HA is configured with use_x_forwarded_for + trusted_proxies.
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - x-forwarded-for
              - x-forwarded-proto
              - x-forwarded-host
              - x-forwarded-port
              - x-real-ip
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: homeassistant
---
# Envoy Backend→Pi-hole :80 times out (other Drury ports OK). Proxy via in-cluster nginx.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-proxy
  namespace: transitional
data:
  default.conf: |
    server {
      listen 80;
      location / {
        proxy_pass http://192.168.1.11;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-proxy
  namespace: transitional
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole-proxy
  template:
    metadata:
      labels:
        app: pihole-proxy
    spec:
      # naboo (scarif VM) cannot reach Pi-hole :80; yavin can.
      nodeSelector:
        kubernetes.io/hostname: yavin
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: conf
          configMap:
            name: pihole-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-proxy
  namespace: transitional
spec:
  selector:
    app: pihole-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole
  namespace: transitional
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - pihole.lab.jacobdrury.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pihole-proxy
          port: 80
---
