# Phase 2 transitional routes: TLS on Envoy, backends stay on legacy hosts.
# DNS A records → 192.168.5.21 (see infrastructure/lab.yaml dns.app_hosts).
# Cut over later by retargeting Backend EndpointSlices to in-cluster Services.
---
# --- helpers: Service + EndpointSlice (IPv4) for each legacy backend ---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: transitional
spec:
  ports:
    - name: http
      port: 8096
      targetPort: 8096
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jellyfin
  namespace: transitional
  labels:
    kubernetes.io/service-name: jellyfin
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8096
endpoints:
  - addresses:
      - "192.168.1.9"
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: transitional
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - jellyfin.lab.jacobdrury.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jellyfin
          port: 8096
---
