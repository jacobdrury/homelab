# Merge OIDC client secret into chart-managed argocd-secret.
# Homelab 1Password item: "prd Argo CD OIDC" (password field) — same item Authentik uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: oidc.authentik.clientSecret
      remoteRef:
        key: prd Argo CD OIDC
        property: password
