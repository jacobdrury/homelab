global:
  domain: argocd.lab.jacobdrury.com

configs:
  params:
    server.insecure: true
  cm:
    url: https://argocd.lab.jacobdrury.com
    timeout.reconciliation: 120s
    # Homepage widget — https://gethomepage.dev/widgets/services/argocd/
    accounts.homepage: apiKey
    # Direct OIDC (dex stays disabled). Issuer slug must match Authentik blueprint.
    oidc.config: |
      name: Authentik
      issuer: https://auth.lab.jacobdrury.com/application/o/argocd/
      clientID: argocd
      clientSecret: $oidc.authentik.clientSecret
      requestedScopes: ["openid", "profile", "email"]
      requestedIDTokenClaims: {"groups": {"essential": true}}
  rbac:
    policy.csv: |
      g, homepage, role:readonly
      g, Argo CD Admins, role:admin

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  ingress:
    enabled: false

controller:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
