global:
  domain: argocd.lab.jacobdrury.com

configs:
  params:
    server.insecure: true
  cm:
    url: https://argocd.lab.jacobdrury.com
    timeout.reconciliation: 120s
    # Homepage widget — https://gethomepage.dev/widgets/services/argocd/
    accounts.homepage: apiKey
  rbac:
    policy.csv: |
      g, homepage, role:readonly

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  ingress:
    enabled: false

controller:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
