# Namespace labels: default PSA is fine (non-root alpine).
apiVersion: v1
kind: Namespace
metadata:
  name: etcd-backup
---
# Talos injects a matching Secret with credentials for talosctl.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-backup
  namespace: etcd-backup
spec:
  roles:
    - os:etcd:backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etcd-backup
  namespace: etcd-backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: scarif-iscsi
  resources:
    requests:
      storage: 5Gi
---
# Every 6 hours; keep the newest 14 snapshots (~3.5 days).
# alpine + pinned talosctl binary (siderolabs/talosctl image is scratch / no shell).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot
  namespace: etcd-backup
spec:
  schedule: "15 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-snapshot
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          containers:
            - name: snapshot
              image: docker.io/library/alpine:3.20.3@sha256:029a752048e32e843bd6defe3841186fb8d19a28dae8ec287f433bb9d6d1ad85
              imagePullPolicy: IfNotPresent
              env:
                - name: NODE
                  value: "192.168.5.11"
                - name: KEEP
                  value: "14"
                - name: TALOSCTL_VERSION
                  value: "v1.12.7"
                - name: TALOSCTL_SHA256
                  value: "9f2626b4755cbd72401cacdf1812878ae6d738b8355c9e8d3600ecebb39a02ca"
              command:
                - /bin/sh
                - -ec
                - |
                  set -eu
                  apk add --no-cache curl >/dev/null
                  curl -fsSL -o /tmp/talosctl \
                    "https://github.com/siderolabs/talos/releases/download/${TALOSCTL_VERSION}/talosctl-linux-amd64"
                  echo "${TALOSCTL_SHA256}  /tmp/talosctl" | sha256sum -c -
                  chmod +x /tmp/talosctl
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  out="/backup/etcd-${ts}.snap"
                  echo "snapshot -> ${out} (node=${NODE})"
                  /tmp/talosctl -n "${NODE}" etcd snapshot "${out}"
                  ls -1t /backup/etcd-*.snap 2>/dev/null | tail -n +"$((KEEP + 1))" | while read -r f; do
                    rm -f "${f}"
                  done
                  ls -lah /backup
              securityContext:
                allowPrivilegeEscalation: false
                # Root needed for apk + writing talosctl under /tmp; still no privilege escalation.
                runAsNonRoot: false
                runAsUser: 0
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: etcd-backup
            - name: talos-secrets
              secret:
                secretName: etcd-backup
            - name: tmp
              emptyDir: {}
