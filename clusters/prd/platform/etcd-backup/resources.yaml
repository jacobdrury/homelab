# Namespace labels: default PSA is fine (non-root where possible).
apiVersion: v1
kind: Namespace
metadata:
  name: etcd-backup
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
# Talos injects a matching Secret with credentials for talosctl.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-backup
  namespace: etcd-backup
spec:
  roles:
    - os:etcd:backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etcd-backup
  namespace: etcd-backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: scarif-iscsi
  resources:
    requests:
      storage: 5Gi
---
# Every 6 hours; keep the newest 14 snapshots (~3.5 days).
# Init: pinned talosctl (scratch image). Main: alpine rename + retention (no network).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot
  namespace: etcd-backup
spec:
  schedule: "15 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-snapshot
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          initContainers:
            - name: snapshot
              image: ghcr.io/siderolabs/talosctl:v1.12.7
              imagePullPolicy: IfNotPresent
              command:
                - /talosctl
              args:
                - -n
                - "192.168.5.11"
                - etcd
                - snapshot
                - /backup/.inprogress.snap
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
          containers:
            - name: retain
              image: docker.io/library/alpine:3.20.3@sha256:029a752048e32e843bd6defe3841186fb8d19a28dae8ec287f433bb9d6d1ad85
              imagePullPolicy: IfNotPresent
              env:
                - name: KEEP
                  value: "14"
              command:
                - /bin/sh
                - -ec
                - |
                  set -eu
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  out="/backup/etcd-${ts}.snap"
                  mv /backup/.inprogress.snap "${out}"
                  echo "saved ${out}"
                  ls -1t /backup/etcd-*.snap 2>/dev/null | tail -n +"$((KEEP + 1))" | while read -r f; do
                    rm -f "${f}"
                  done
                  ls -lah /backup
              securityContext:
                allowPrivilegeEscalation: false
                # Init (talosctl) writes as root; retain must move/delete those files.
                runAsNonRoot: false
                runAsUser: 0
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: etcd-backup
            - name: talos-secrets
              secret:
                secretName: etcd-backup
