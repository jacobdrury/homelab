ipam:
  mode: kubernetes

kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445

# Tailscale L3 Service proxies DNAT tailnet traffic to ClusterIPs. Keep socket
# LB on the host, but use Cilium's packet path inside Pod namespaces so those
# forwarded packets receive normal ClusterIP load balancing.
# https://tailscale.com/docs/kubernetes-operator/reference/compatibility
socketLB:
  enabled: true
  hostNamespaceOnly: true

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

bpf:
  hostLegacyRouting: true

operator:
  replicas: 1

l2announcements:
  enabled: true

k8sClientRateLimit:
  qps: 50
  burst: 100

hubble:
  enabled: false
  relay:
    enabled: false
  ui:
    enabled: false
