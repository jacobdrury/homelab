apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      targetRevision: 1.19.7
      helm:
        releaseName: cilium
        valueFiles:
          - $values/clusters/prd/platform/cilium/values.yaml
    - repoURL: https://github.com/jacobdrury/homelab.git
      targetRevision: main
      ref: values
  # L2 LoadBalancer pool/policy removed — Envoy uses hostNetwork VIP .21 on yavin.
  # Phase 4 HA for .21: docs/architecture/networking.md § HTTPS.
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
