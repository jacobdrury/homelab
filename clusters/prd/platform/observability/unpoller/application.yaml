# UniFi metrics via unpoller → Prometheus; Sites dashboard for Grafana sidecar.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unpoller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  project: default
  source:
    repoURL: https://github.com/jacobdrury/homelab.git
    targetRevision: main
    path: clusters/prd/platform/observability/unpoller
    directory:
      include: '{resources,dashboard-sites}.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
