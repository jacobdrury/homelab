# Shared MariaDB — one instance, many app databases (Kuma first).
# Chart: oci://registry-1.docker.io/bitnamicharts/mariadb
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  sources:
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: mariadb
      targetRevision: 27.3.0
      helm:
        releaseName: mariadb
        valueFiles:
          - $values/clusters/prd/platform/mariadb/values.yaml
    - repoURL: https://github.com/jacobdrury/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/jacobdrury/homelab.git
      targetRevision: main
      path: clusters/prd/platform/mariadb
      directory:
        include: resources.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mariadb
  # Bitnami STS: API defaults / empty arrays drift forever under SSA + selfHeal.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: mariadb
      jsonPointers:
        - /spec/volumeClaimTemplates
        - /spec/persistentVolumeClaimRetentionPolicy
      jqPathExpressions:
        - .spec.template.spec.securityContext.supplementalGroups
        - .spec.template.spec.securityContext.sysctls
        - .spec.template.spec.affinity.nodeAffinity
        - .spec.template.spec.affinity.podAffinity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
