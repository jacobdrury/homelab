# Shared MariaDB — one instance, many app databases (Kuma first).
# Official docker.io/library/mariadb (Bitnami chart retired).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/jacobdrury/homelab.git
    targetRevision: main
    path: clusters/prd/platform/mariadb
    directory:
      include: '{mariadb,resources}.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: mariadb
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
