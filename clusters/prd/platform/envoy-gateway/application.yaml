# Official Envoy Gateway → Argo CD install pattern:
# https://gateway.envoyproxy.io/docs/install/install-argocd/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: v1.9.1
      helm:
        releaseName: eg
        valueFiles:
          - $values/clusters/prd/platform/envoy-gateway/values.yaml
    - repoURL: https://github.com/jacobdrury/homelab.git
      targetRevision: main
      ref: values
    # Gateway / Certificate / HTTPRoutes (quickstart equivalent, GitOps)
    - repoURL: https://github.com/jacobdrury/homelab.git
      targetRevision: main
      path: clusters/prd/platform/envoy-gateway
      directory:
        include: resources.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # Helm certgen PreSync hooks linger in the resource tree after sync.
  ignoreDifferences:
    - group: ""
      kind: ServiceAccount
      name: eg-gateway-helm-certgen
    - group: rbac.authorization.k8s.io
      kind: Role
      name: eg-gateway-helm-certgen
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
      name: eg-gateway-helm-certgen
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: eg-gateway-helm-certgen:envoy-gateway-system
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: eg-gateway-helm-certgen:envoy-gateway-system
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: envoy-gateway-topology-injector.envoy-gateway-system
