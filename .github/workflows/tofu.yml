# OpenTofu via moon ci — plan/validate on PR, apply on main.
# Secrets stay in 1Password; GitHub only stores OP_SERVICE_ACCOUNT_TOKEN.
# Setup: docs/setup/opentofu-ci.md
name: OpenTofu

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: opentofu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  tofu:
    name: moon ci
    runs-on: ubuntu-latest
    # Public repo: never run secret-bearing jobs on fork PRs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # Cloudflare + R2 (all projects use R2 backend)
          TF_VAR_cloudflare_api_token: op://Homelab/Cloudflare Zone DNS API Token/credential
          AWS_ACCESS_KEY_ID: op://Homelab/Homelab R2 tofu state/access key id
          AWS_SECRET_ACCESS_KEY: op://Homelab/Homelab R2 tofu state/secret access key
          # UniFi (Homelab gateway via Tailscale subnet route)
          TF_VAR_unifi_api_key: op://Homelab/bqbnkqxcyyg6h72orwebvozdjm/credential
          UNIFI_INSECURE: "true"
          # Tailscale OpenTofu provider (existing OAuth)
          TAILSCALE_OAUTH_CLIENT_ID: op://Homelab/Tailscale OAuth/client id
          TAILSCALE_OAUTH_CLIENT_SECRET: op://Homelab/Tailscale OAuth/credential
          TAILSCALE_TAILNET: "-"
          # Tailscale GitHub Action (separate OAuth client tagged tag:ci)
          TS_OAUTH_CLIENT_ID: op://Homelab/Tailscale CI OAuth/client id
          TS_OAUTH_SECRET: op://Homelab/Tailscale CI OAuth/credential
          # Uptime Kuma API via Tailscale L3 Service expose (not Authentik)
          UPTIMEKUMA_USERNAME: op://Homelab/Uptime Kuma/username
          UPTIMEKUMA_PASSWORD: op://Homelab/Uptime Kuma/password
          # Keep in sync with infrastructure/lab.yaml services.uptime_kuma.api_endpoint
          UPTIMEKUMA_ENDPOINT: http://uptime-kuma.ibex-ladon.ts.net:3001

      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
          # accept-dns: MagicDNS for *.ts.net; accept-routes: Homelab UniFi gateway
          args: --accept-routes --accept-dns
          # Wait for peer map + path before OpenTofu (Kuma L3 expose).
          ping: uptime-kuma.ibex-ladon.ts.net

      # Prefer Tailscale IPv4 — dual-stack MagicDNS can dial IPv6 and hang on GHA.
      - name: Resolve Uptime Kuma Tailscale IPv4
        run: |
          set -euo pipefail
          IP="$(tailscale status --json | jq -r '
            .Peer[]?
            | select((.DNSName // "") | startswith("uptime-kuma."))
            | .TailscaleIPs[]
            | select(test("^[0-9.]+$"))
            ' | head -n1)"
          if [ -z "${IP}" ]; then
            echo "::error::uptime-kuma Tailscale IPv4 not in peer map"
            tailscale status
            exit 1
          fi
          echo "Resolved uptime-kuma -> ${IP}"
          code="$(curl -sS --connect-timeout 5 --max-time 15 -o /dev/null -w '%{http_code}' "http://${IP}:3001/" || true)"
          echo "HTTP ${code}"
          case "${code}" in
            2*|3*) ;;
            *)
              echo "::error::TCP/HTTP to ${IP}:3001 failed (HTTP ${code})"
              exit 1
              ;;
          esac
          echo "UPTIMEKUMA_ENDPOINT=http://${IP}:3001" >> "${GITHUB_ENV}"

      - name: Validate and plan
        if: github.event_name == 'pull_request'
        run: moon ci :validate :plan

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: moon ci :apply

      - uses: moonrepo/run-report-action@v1
        if: github.event_name == 'pull_request' && (success() || failure())
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
